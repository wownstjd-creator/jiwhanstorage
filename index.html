<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>엄빠에게 보내는 카네이션</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
    min-height: 100vh;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: linear-gradient(160deg, #fff1f4 0%, #ffe4ea 45%, #fff8ef 100%);
    overflow-x: hidden;
    color: #5b2630;
    display: flex;
    align-items: center;
    justify-content: center;
  }

    .wrap {
      width: min(92vw, 430px);
      min-height: 680px;
      position: relative;
      padding: 32px 22px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.48);
      box-shadow: 0 24px 60px rgba(200, 80, 100, 0.22);
      backdrop-filter: blur(12px);
      text-align: center;
      overflow: hidden;
    }

    .soft-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.45;
      animation: float 6s ease-in-out infinite;
    }

    .c1 { width: 120px; height: 120px; background: #ff9aad; top: -30px; left: -30px; }
    .c2 { width: 90px; height: 90px; background: #ffd166; right: -20px; top: 90px; animation-delay: 1s; }
    .c3 { width: 140px; height: 140px; background: #ffc2d1; bottom: -40px; right: -35px; animation-delay: 2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(14px); }
    }

    .badge {
      position: relative;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: #fff;
      color: #d94862;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(217, 72, 98, 0.14);
      margin-bottom: 20px;
    }

    h1 {
      position: relative;
      font-size: 30px;
      line-height: 1.28;
      letter-spacing: -1px;
      margin-bottom: 10px;
    }

    .subtitle {
      position: relative;
      font-size: 15px;
      color: #7c4b55;
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .flower-area {
      position: relative;
      height: 260px;
      margin: 8px auto 18px;
    }

    .stem {
      position: absolute;
      left: 50%;
      top: 128px;
      width: 10px;
      height: 150px;
      background: linear-gradient(#2f9e44, #1f7a36);
      border-radius: 999px;
      transform: translateX(-50%);
      box-shadow: inset -2px 0 rgba(255,255,255,0.2);
    }

    .leaf {
      position: absolute;
      width: 70px;
      height: 36px;
      background: #38b000;
      border-radius: 70px 0 70px 0;
      top: 190px;
      left: 50%;
      transform-origin: left center;
      box-shadow: inset -8px -5px rgba(0,0,0,0.08);
    }

    .leaf.left {
      transform: translateX(-8px) rotate(28deg) scaleX(-1);
    }

    .leaf.right {
      transform: translateX(8px) rotate(-28deg);
    }

    .flower {
      position: absolute;
      left: 50%;
      top: 40px;
      width: 170px;
      height: 170px;
      transform: translateX(-50%);
      animation: bloom 1.6s ease-out both;
    }

    @keyframes bloom {
      0% { transform: translateX(-50%) scale(0.2) rotate(-10deg); opacity: 0; }
      70% { transform: translateX(-50%) scale(1.08) rotate(3deg); opacity: 1; }
      100% { transform: translateX(-50%) scale(1) rotate(0); opacity: 1; }
    }

    .petal {
      position: absolute;
      width: 82px;
      height: 92px;
      background: radial-gradient(circle at 30% 28%, #ffb3c1 0%, #f05a75 42%, #d7263d 100%);
      border-radius: 60% 60% 50% 50%;
      left: 44px;
      top: 32px;
      transform-origin: 50% 80%;
      box-shadow: inset -8px -12px rgba(136, 20, 45, 0.13);
    }

    .p1 { transform: rotate(0deg) translateY(-38px); }
    .p2 { transform: rotate(45deg) translateY(-38px); }
    .p3 { transform: rotate(90deg) translateY(-38px); }
    .p4 { transform: rotate(135deg) translateY(-38px); }
    .p5 { transform: rotate(180deg) translateY(-38px); }
    .p6 { transform: rotate(225deg) translateY(-38px); }
    .p7 { transform: rotate(270deg) translateY(-38px); }
    .p8 { transform: rotate(315deg) translateY(-38px); }

    .center {
      position: absolute;
      width: 58px;
      height: 58px;
      left: 56px;
      top: 56px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe066 0%, #ff9f1c 62%, #d46b08 100%);
      box-shadow: 0 6px 18px rgba(150, 60, 40, 0.2);
    }

    .message-box {
      position: relative;
      background: rgba(255,255,255,0.78);
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: 0 12px 28px rgba(170, 80, 90, 0.13);
      transform: translateY(12px);
      opacity: 0;
      transition: 0.7s ease;
    }

    .message-box.show {
      transform: translateY(0);
      opacity: 1;
    }

    .message-box p {
      font-size: 16px;
      line-height: 1.9;
      word-break: keep-all;
    }

    .from {
      margin-top: 14px;
      font-weight: 800;
      color: #d94862;
    }

    button {
      position: relative;
      border: none;
      margin-top: 16px;
      padding: 14px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #f03e5f, #ff8fa3);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(240, 62, 95, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
      box-shadow: 0 6px 14px rgba(240, 62, 95, 0.2);
    }

    .falling-petal {
      position: fixed;
      top: -30px;
      width: 18px;
      height: 24px;
      background: #ff6b81;
      border-radius: 60% 60% 60% 10%;
      opacity: 0.8;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    .heart {
      display: inline-block;
      animation: beat 1.2s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    @media (max-height: 720px) {
      .wrap { min-height: 620px; padding-top: 24px; }
      .flower-area { height: 230px; }
      .stem { height: 125px; }
      h1 { font-size: 27px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="soft-circle c1"></div>
    <div class="soft-circle c2"></div>
    <div class="soft-circle c3"></div>

    <div class="badge">🌹 어버이날 선물 도착</div>

    <h1>엄빠,<br />카네이션 대신 웹사이트를 줄게</h1>

    <p class="subtitle">
      직접 갈 수는 없지만,<br />너무 서운해 하지는 말길 예비군은 쩔수잖아.
    </p>

    <section class="flower-area" aria-label="카네이션 그림">
      <div class="stem"></div>
      <div class="leaf left"></div>
      <div class="leaf right"></div>
      <div class="flower">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>
        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="center"></div>
      </div>
    </section>

    <button onclick="openLetter()">엄빠 이거 누르면 됨</button>

    <section class="message-box" id="letter">
      <p>
        엄빠, 어버이날 축하해.<br />
        자주 표현은 못 해도 항상 고맙게 생각하고 있어.<br />
        
        그래그래, 용돈도 가끔 많이 챙겨주고<br />
        항상 건강하고, 준성이한테도 너무 머라하지말고<br />
        진짜 이만한 아들 없다 ㅇㅈ? 나중에 취업하면 첫월급은 진짜 쏠게 <br />
        아마 못할듯
      </p>
      <div class="from">귀찮은 아들이 </div>
    </section>
  </main>

  <script>
    const letter = document.getElementById("letter");
    let opened = false;

    function openLetter() {
      letter.classList.add("show");
      if (!opened) {
        opened = true;
        rainPetals();
      }
    }

    function rainPetals() {
      for (let i = 0; i < 38; i++) {
        setTimeout(() => {
          const petal = document.createElement("div");
          petal.className = "falling-petal";
          petal.style.left = Math.random() * 100 + "vw";
          petal.style.animationDuration = 4 + Math.random() * 3 + "s";
          petal.style.transform = `rotate(${Math.random() * 360}deg)`;
          petal.style.background = Math.random() > 0.5 ? "#ff6b81" : "#f03e5f";
          document.body.appendChild(petal);

          setTimeout(() => {
            petal.remove();
          }, 7500);
        }, i * 110);
      }
    }
  </script>
</body>
</html>
